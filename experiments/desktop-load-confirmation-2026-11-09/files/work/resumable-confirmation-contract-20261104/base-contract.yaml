schema_version: 3
experiment_id: gpt-oss-20b-m4-resumable-prepared-20261104
model:
  repository: openai/gpt-oss-20b
  revision: 6cee5e81ee83917806bbde320786a8fb61efebee
  architecture: gpt_oss
  expert_weight_format: native_mxfp4
  activation_dtype: bfloat16
  kv_cache_dtype: bfloat16
  requantize_weights: false
hardware:
  chip: Apple M4
  memory_gib: 24
  model_identifier: Mac16,12
  backend: mlx_metal
workload:
  batch_size: 1
  prompt_lengths:
  - 512
  - 2048
  - 4096
  generation_tokens: 128
  seed: 42
  input_source: fixed_token_ids
  sampling: greedy
  prefill_step_size: 4096
  eos_stopping: false
  reuse_prompt_cache: false
correctness:
  reference: unmodified_mlx_lm_same_checkpoint
  tolerance_status: provisional
  atol: 0.02
  rtol: 0.02
  require_finite: true
  require_shape_match: true
  require_dtype_match: true
  required_cases:
  - decode
  - prefill
  - uneven_expert_load
  - unused_experts
  - non_divisible_token_counts
  - large_finite_activations
  - held_out_inputs
measurement:
  exploration:
    swap_policy: retain_and_flag
    max_requests: 128
    max_wall_time_seconds: 7200
    preserve_completed_work: true
    observe_phase_memory: true
    allow_speedup_claims: false
  confirmation:
    swap_policy: retain_and_flag_desktop_load
    require_fresh_matched_comparisons: true
benchmark:
  warmups: 5
  trials_per_implementation: 20
  order: alternating_ab_ba
  synchronize_before_and_after: true
  primary_metric: decode_tokens_per_second
  required_metrics:
  - decode_tokens_per_second
  - time_to_first_token_ms
  - prefill_tokens_per_second
  - inter_token_latency_ms
  - peak_memory_bytes
  - full_model_wall_time_ms
  statistics:
  - median
  - p90
  - mad
  resident_model: true
  include_model_loading: false
  include_agent_activity: false
  invalidate_on_swap_growth: false
  invalidate_on_thermal_change: true
acceptance:
  status: provisional
  enabled: false
  minimum_speedup: 1.05
  maximum_p90_latency_ratio: 1.02
  maximum_peak_memory_ratio: 1.05
  require_all_correctness_cases: true
  require_improvement_above_noise: true
task_quality:
  required: true
  status: planned
  suite_sha256: null
  metric: null
  maximum_score_drop: null
agent:
  candidate_root: candidates
  optimization_boundary: complete_decode
  allowed_implementation_types:
  - mlx
  - metal
  protected_paths:
  - AGENTS.md
  - kernelmaxxing.yaml
  - pyproject.toml
  - uv.lock
  - orchestrator
  - target
  - evaluator
  - tests
  - reports
  - .kernelmaxxing
  - candidates/README.md
  - candidates/candidate-template
